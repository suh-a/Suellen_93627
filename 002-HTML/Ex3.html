<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <center>
        <title>Trabalhando com tabelas</title>
    </center>
</head>
    <body>
        <header>
            <center> 
                <h1>
                <font color="Orange" face="Arial">Trabalhando com tabelas</font>
                </h1>
                </center>
        </header> 
        <main>
            <div>
                <h2>
                <center>Tabela de eletrônicos</center>
                </h2>
                <center>
                    <table border = "1">
                    <tr> <!-- cabeçalho da tabela-->
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                    </tr>

                    <tr>
                        <td>Notebook Samsung book 4</td>
                        <td align = "center">R$ 4500,00</td>
                        <td align = "center">50</td>
                    </tr>

                    <tr>
                        <td>Galaxy Watch 8 clasic</td>
                        <td align = "center">R$ 3600,00</td>
                        <td align = "center">20</td>
                    </tr>

                    <tr>
                        <td>Galaxy S25 Ultra</td>
                        <td align = "center">R$ 8500,00</td>
                        <td align = "center">30</td>
                    </tr>

                    <tr>
                        <td>Tab S9 FE</td>
                        <td align = "center">R$ 4200,00</td>
                        <td align = "center">25</td>
                    </tr>

                    <tr>
                        <td>Monitor Odissey G30 '32</td>
                        <td align = "center">R$ 7700,00</td>
                        <td align = "center">45</td>
                    </tr>


                    </table>
                </center>
                
            </div>
        </main>
           
    </body>
</html>
