<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device, initial-scale=1.0">
    <title>Exemplo de cadastro</title>
</head>
<body>
   
        <h1>Casdastro de usuário</h1>

    <!-- Início do Formulário -->
     <form action="/submit" method="POST">
        <!-- Campo de Nome -->
        <label for="nome-completo">Nome completo:</label>
        <input type="text" id="nome-completo" name="nome-completo" required><br><br>

        <!-- Campo de E-mail -->
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="data-nascimento">Data de nascimento:</label>
        <input type="date" id="data-nascimento" name="data-nascimento" required><br><br>

        <label for="Sexo">Sexo:</label><br>
        <input type="radio" id="masculino" name="sexo" value = "Masculino" required>
        <label for="Masculino">Masculino:</label>
        <input type="radio" id="feminino" name="sexo" value = "Feminino" required>
        <label for="Feminino">Feminino:</label><br><br>

        <label for="interesses">Interesses:</label><br>
        <input type="checkbox" id="tecnologia" name="interesses" value = "tecnologia" 
        <label for = "tecnologia">Tecnologia</label><br>
        <input type="checkbox" id="musica" name="interesses" value = "musica" 
        <label for = "musica">Musica</label><br>
        <input type="checkbox" id="esportes" name="interesses" value = "esportes" 
        <label for = "esportes">Musica</label><br><br>

        <label for = "cidade">Cidade:</label>
        <select id = "cidade" name = "cidade" required>
            <option value = " "> </option>
            <option value = "ba">Salvador</option>
            <option value = "sp">Sao Paulo</option>
            <option value = "Rj">Rio de Janeiro</option>
        </select><br><br>

        <!-- Botão de cadastrar -->
        <input type="submit" value="Cadastrar">
    

     </form>
     <!-- Fim  do Formulário-->

</body>
</html>
