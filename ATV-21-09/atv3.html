<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição para evento</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 40px;
    }
    h1 {
        color: #333;
        text-align: center;
        margin-bottom: 20px;
    }
    form {
        max-width: 500px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }
    /* --- Deixa cada input de opção em linha própria --- */
    .opcao {
        display: block;      /* força quebra de linha */
        font-weight: normal; /* rótulo normal */
        margin: 6px 0;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ccc;
    }
    button {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #45a049;
    }
    #mensagem {
        text-align: center;
        margin-top: 20px;
        font-size: 18px;
        color: green;
        display: none;
    }
</style>
</head>
<body>

<h1>Inscrição para evento</h1>

<form id="form-inscricao">
    <label for="nome-completo">Nome completo:</label>
    <input type="text" id="nome-completo" name="nome-completo" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="telefone">Telefone:</label>
    <input type="number" id="telefone" name="telefone" required>

    <label for="data-nascimento">Data de nascimento:</label>
    <input type="date" id="data-nascimento" name="data-nascimento" required>

    <label>Sexo:</label>
    <label class="opcao"><input type="radio" name="sexo" value="Masculino" required> Masculino</label>
    <label class="opcao"><input type="radio" name="sexo" value="Feminino" required> Feminino</label>
    <label class="opcao"><input type="radio" name="sexo" value="Outro" required> Outro</label>

    <label>Interesses:</label>
    <label class="opcao"><input type="checkbox" name="interesses" value="palestras"> Palestras</label>
    <label class="opcao"><input type="checkbox" name="interesses" value="workshops"> Workshops</label>
    <label class="opcao"><input type="checkbox" name="interesses" value="networking"> Networking</label>

    <button type="submit">Inscrever-se</button>
</form>

<div id="mensagem">Inscrição bem-sucedida!</div>

<script>
    const form = document.getElementById('form-inscricao');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        mensagem.style.display = 'block';
        form.reset();
    });
</script>

</body>
</html>
