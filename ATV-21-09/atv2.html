<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .nova-tarefa {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 250px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        ol {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
        li {
            margin-bottom: 10px;
            font-size: 18px;
        }
        /* Estilo de tarefa concluída */
        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <h1>Minhas Tarefas</h1>

    <div class="nova-tarefa">
        <label for="tarefa">Digite uma nova tarefa:</label>
        <input type="text" id="tarefa" name="tarefa">
        <button onclick="adicionar()">Adicionar</button>
    </div>

    <!-- Lista de tarefas inicia vazia -->
    <ol id="lista-tarefas">
    </ol>

    <script>
        let contador = 0; // para IDs únicos

        function adicionar() {
            const input = document.getElementById('tarefa');
            const texto = input.value.trim();
            if (texto === "") return; // ignora vazio

            contador++;
            const lista = document.getElementById('lista-tarefas');

            // Cria elementos
            const li = document.createElement('li');
            const checkbox = document.createElement('input');
            const label = document.createElement('label');

            // Configura atributos
            const id = 'tarefa-' + contador;
            checkbox.type = 'checkbox';
            checkbox.id = id;

            label.htmlFor = id;
            label.textContent = texto;

            // Monta e adiciona
            li.appendChild(checkbox);
            li.appendChild(label);
            lista.appendChild(li);

            // Limpa o campo
            input.value = "";
            input.focus();
        }
    </script>

</body>
</html>
