<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lojas S.A</title>
</head>
<body bgcolor="#f9f9f9">

    <!-- Cabeçalho com logotipo/banner -->
    <center>
        <img src="img/logotipo.jpg" alt="Logotipo da loja" width="250">
        <h1>📦 Lojas S.A - Fale Conosco</h1>
    </center>
    <hr>

    <!-- Formulário -->
    <center>
        <h2>Formulário de Contato</h2>
        <form action="#" method="post">
            <!-- Nome -->
            <p>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>

            <!-- E-mail -->
            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <!-- Telefone -->
            <p>
                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" placeholder="(xx) xxxxx-xxxx">
            </p>

            <!-- Seleção de produto -->
            <p>
                <label for="produto">Selecione o produto/serviço:</label><br>
                <select id="produto" name="produto">
                    <option value="iphone">iPhone 17 Pro Max</option>
                    <option value="macbook">MacBook</option>
                    <option value="watch">Apple Watch</option>
                    <option value="outro">Outro</option>
                </select>
            </p>

            <!-- Mensagem -->
            <p>
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>
            </p>

            <!-- Botões -->
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </center>

    <hr>

    <!-- Tabela de produtos -->
    <center>
        <table border="1" cellpadding="10" cellspacing="0" width="80%">
            <caption><b>Tabela de Produtos Disponíveis</b></caption>

            <!-- Cabeçalho principal -->
            <tr bgcolor="#dcdcdc">
                <th rowspan="2">Imagem</th>
                <th colspan="2">Informações do Produto</th>
                <th rowspan="2">Preço</th>
            </tr>
            <tr bgcolor="#eaeaea">
                <th>Nome</th>
                <th>Descrição</th>
            </tr>

            <!-- Produto 1 -->
            <tr align="center">
                <td>
                    <a href="produto1.html">
                        <img src="img/produto1.jpg" alt="Produto 1" width="100">
                    </a>
                </td>
                <td>iPhone 17 Pro Max</td>
                <td>Cor laranja</td>
                <td>R$ 12.000</td>
            </tr>

            <!-- Produto 2 -->
            <tr align="center" bgcolor="#f9f9f9">
                <td>
                    <a href="produto2.html">
                        <img src="img/produto2.jpg" alt="Produto 2" width="100">
                    </a>
                </td>
                <td>MacBook</td>
                <td>Cor bege</td>
                <td>R$ 7.000</td>
            </tr>

            <!-- Produto 3 -->
            <tr align="center">
                <td>
                    <a href="produto3.html">
                        <img src="img/produto3.jpg" alt="Produto 3" width="100">
                    </a>
                </td>
                <td>Apple Watch</td>
                <td>Cor branca</td>
                <td>R$ 3.700</td>
            </tr>

        </table>
    </center>

    <!-- Rodapé -->
    <hr>
    <p align="center">
        <a href="sobre.html">Sobre nós</a> | 
        <a href="contato.html">Contato</a> | 
        <a href="ajuda.html">Ajuda</a>
    </p>

</body>
</html>
