<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lojas S.A - Contato</title>
</head>
<body bgcolor="#f9f9f9">

    <!-- Cabeçalho -->
    <center>
        <img src="img/logotipo.jpg" alt="Logotipo da Loja" width="200">
        <h1>📧 Lojas S.A - Contato</h1>
        <p>
            <a href="atv8-pg1.html">Home</a>
        </p>
    </center>
    <hr>

    <!-- Formulário -->
    <center>
        <h2>Entre em Contato</h2>
        <form action="#" method="post">
            <p>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required>
            </p>

            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="assunto">Assunto:</label><br>
                <select id="assunto" name="assunto">
                    <option value="duvida">Dúvida</option>
                    <option value="orcamento">Orçamento</option>
                    <option value="suporte">Suporte</option>
                    <option value="outro">Outro</option>
                </select>
            </p>

            <p>
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </form>
    </center>

    <!-- Link para voltar -->
    <hr>
    <p align="center">
        <a href="index.html">⬅ Voltar para a Home</a>
    </p>

</body>
</html>
