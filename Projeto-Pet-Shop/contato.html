<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Shop - Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <img src="img/pet-logo.jpg" alt="Logo Pet Shop" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo -->
  <main>
    <section class="contato">
      <h1>Fale Conosco</h1>
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Seu e-mail" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem" required></textarea>

        <button type="submit">Enviar</button>
    </form>


      <!-- WhatsApp -->
      <section class="whatsapp-contato">
        <h2>Ou fale diretamente pelo WhatsApp</h2>
        <a href="https://wa.me/5591999999999" class="whatsapp-botao" target="_blank">
          <img src="img/whatsapp.jpg" alt="WhatsApp">
          Enviar mensagem no WhatsApp
        </a>
      </section>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>&copy; 2025 Pet Shop Alegria Animal. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
